<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">MWFL architecture</title>
  <desc id="desc">Windows GUI, CLI, Service, and Worker applications use independently linked MWFL UI, Desktop, Foundation, and System components over native Windows 10 and newer APIs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12335b"/>
      <stop offset="1" stop-color="#185b8f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a7897"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="538" rx="20" fill="url(#background)" stroke="#c8d8e8" stroke-width="2"/>

  <rect x="48" y="34" width="1104" height="88" rx="16" fill="url(#header)" filter="url(#shadow)"/>
  <text x="600" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Windows applications</text>
  <text x="600" y="100" text-anchor="middle" fill="#ccecff" font-family="Segoe UI, Arial, sans-serif" font-size="19">GUI  ·  CLI  ·  Service  ·  Worker</text>

  <path d="M600 122 V153" stroke="#5a7897" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="34" y="158" width="1132" height="244" rx="18" fill="#ffffff" stroke="#8fb4d6" stroke-width="2"/>
  <rect x="34" y="158" width="1132" height="45" rx="18" fill="#dceeff"/>
  <path d="M34 185 Q34 203 52 203 H1148 Q1166 203 1166 185 V203 H34 Z" fill="#dceeff"/>
  <text x="600" y="188" text-anchor="middle" fill="#12335b" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">MWFL · independently linked C++20 components</text>

  <g filter="url(#shadow)">
    <rect x="62" y="226" width="252" height="143" rx="13" fill="#f3f9ff" stroke="#55a5d8" stroke-width="2"/>
    <rect x="336" y="226" width="252" height="143" rx="13" fill="#f4fbf8" stroke="#49a981" stroke-width="2"/>
    <rect x="612" y="226" width="252" height="143" rx="13" fill="#fff9ef" stroke="#d59a39" stroke-width="2"/>
    <rect x="886" y="226" width="252" height="143" rx="13" fill="#faf6ff" stroke="#9268c7" stroke-width="2"/>
  </g>

  <text x="188" y="261" text-anchor="middle" fill="#12608e" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">UI</text>
  <text x="188" y="292" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Controls · Layout</text>
  <text x="188" y="320" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Events · DPI</text>
  <text x="188" y="348" text-anchor="middle" fill="#63788c" font-family="Segoe UI, Arial, sans-serif" font-size="15">real HWNDs</text>

  <text x="462" y="261" text-anchor="middle" fill="#287b5d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Desktop</text>
  <text x="462" y="292" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Shell · Documents</text>
  <text x="462" y="320" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Printing · Graphics</text>
  <text x="462" y="348" text-anchor="middle" fill="#63788c" font-family="Segoe UI, Arial, sans-serif" font-size="15">optional integrations</text>

  <text x="738" y="261" text-anchor="middle" fill="#9a6519" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Foundation</text>
  <text x="738" y="292" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Process · IPC</text>
  <text x="738" y="320" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Service · Diagnostics</text>
  <text x="738" y="348" text-anchor="middle" fill="#63788c" font-family="Segoe UI, Arial, sans-serif" font-size="15">timeout + cancellation</text>

  <text x="1012" y="261" text-anchor="middle" fill="#6e46a1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">System</text>
  <text x="1012" y="292" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Security · Deployment</text>
  <text x="1012" y="320" text-anchor="middle" fill="#334e68" font-family="Segoe UI, Arial, sans-serif" font-size="17">Scheduler</text>
  <text x="1012" y="348" text-anchor="middle" fill="#63788c" font-family="Segoe UI, Arial, sans-serif" font-size="15">explicit system changes</text>

  <path d="M188 369 V420" stroke="#5a7897" stroke-width="2.5"/>
  <path d="M462 369 V420" stroke="#5a7897" stroke-width="2.5"/>
  <path d="M738 369 V420" stroke="#5a7897" stroke-width="2.5"/>
  <path d="M1012 369 V420" stroke="#5a7897" stroke-width="2.5"/>
  <path d="M188 420 H1012" stroke="#5a7897" stroke-width="2.5"/>
  <path d="M600 420 V447" stroke="#5a7897" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="48" y="452" width="1104" height="60" rx="15" fill="#263e57" filter="url(#shadow)"/>
  <text x="600" y="478" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Native Windows 10+ APIs</text>
  <text x="600" y="501" text-anchor="middle" fill="#cfe4f6" font-family="Segoe UI, Arial, sans-serif" font-size="15">HWND · COM · Shell · SCM · ETW · DPAPI · Named Pipes · Job Objects · Task Scheduler</text>
</svg>
